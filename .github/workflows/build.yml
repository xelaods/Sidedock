name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build installer
        run: npx tauri build

      # 同梱アドオンがフォルダごと入っているか確かめる（manifest.json が 16 個あるはず）
      - name: Check bundled add-ons
        shell: pwsh
        run: |
          $m = Get-ChildItem -Recurse -Filter manifest.json src-tauri/target/release/addons
          $m | ForEach-Object { $_.FullName }
          if ($m.Count -lt 16) { throw "同梱アドオンが見つかりません" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SideDock-setup
          path: src-tauri/target/release/bundle/nsis/*.exe

      # main に push したら、tauri.conf.json のバージョンでリリースを作る（同じバージョンなら差し替える）
      # Artifacts と違い、リリースは GitHub にログインしていなくてもダウンロードできる
      - name: Read version
        if: github.event_name != 'pull_request'
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: SideDock ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          body: |
            下の Assets にある `SideDock_${{ steps.ver.outputs.version }}_x64-setup.exe` をダウンロードして実行してください。
            すでに入っている場合は、タスクトレイから SideDock を終了してから上書きでインストールします。
          files: src-tauri/target/release/bundle/nsis/*.exe
