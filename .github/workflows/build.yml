name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build installer
        run: npx tauri build

      # 同梱アドオンがフォルダごと入っているか確かめる（manifest.json が 4 つあるはず）
      - name: Check bundled add-ons
        shell: pwsh
        run: |
          $m = Get-ChildItem -Recurse -Filter manifest.json src-tauri/target/release/addons
          $m | ForEach-Object { $_.FullName }
          if ($m.Count -lt 4) { throw "同梱アドオンが見つかりません" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SideDock-setup
          path: src-tauri/target/release/bundle/nsis/*.exe

      # v0.1.0 のようなタグを push したら GitHub のリリースにも載せる
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
