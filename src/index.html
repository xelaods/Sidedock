<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>SideDock</title>
  <link rel="stylesheet" href="http://addon.localhost/_sdk/sidedock.css">
  <link rel="stylesheet" href="style.css">
  <script src="main.js" type="module"></script>
</head>
<body data-edge="right">
  <div id="root">
    <section id="panel" hidden aria-labelledby="panel-title">
      <header id="panel-head">
        <h1 id="panel-title"></h1>
        <button id="panel-close" class="sd-btn ghost icon" title="閉じる" aria-label="パネルを閉じる">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 3.5l9 9m0-9l-9 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
        </button>
      </header>
      <div id="panel-body">
        <div id="settings" class="view" hidden></div>
      </div>
    </section>

    <nav id="bar" aria-label="SideDock">
      <div id="bar-items"></div>
      <div id="bar-foot">
        <button id="btn-settings" class="bar-icon" title="設定" aria-label="設定">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
            <path d="M10.3 3.6a1.7 1.7 0 0 1 3.4 0l.1.6a1.7 1.7 0 0 0 2.5 1.1l.5-.3a1.7 1.7 0 0 1 2.4 2.4l-.3.5a1.7 1.7 0 0 0 1.1 2.5l.6.1a1.7 1.7 0 0 1 0 3.4l-.6.1a1.7 1.7 0 0 0-1.1 2.5l.3.5a1.7 1.7 0 0 1-2.4 2.4l-.5-.3a1.7 1.7 0 0 0-2.5 1.1l-.1.6a1.7 1.7 0 0 1-3.4 0l-.1-.6a1.7 1.7 0 0 0-2.5-1.1l-.5.3a1.7 1.7 0 0 1-2.4-2.4l.3-.5a1.7 1.7 0 0 0-1.1-2.5l-.6-.1a1.7 1.7 0 0 1 0-3.4l.6-.1a1.7 1.7 0 0 0 1.1-2.5l-.3-.5a1.7 1.7 0 0 1 2.4-2.4l.5.3a1.7 1.7 0 0 0 2.5-1.1z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </nav>
  </div>
</body>
</html>
