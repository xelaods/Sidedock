<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>SideDock</title>
  <link rel="stylesheet" href="http://addon.localhost/_sdk/sidedock.css">
  <link rel="stylesheet" href="style.css">
  <script src="main.js" type="module"></script>
</head>
<body data-position="center">
  <div id="stage">
    <div id="dock">
      <!-- 隠れているときに上端に残る細い印。カーソルが近づくほど明るく伸びる -->
      <div id="handle" aria-hidden="true"></div>

      <nav id="capsule" aria-label="SideDock">
        <div id="spot" aria-hidden="true"></div>
        <div id="sweep" aria-hidden="true"></div>
        <!-- カーソルを乗せた項目の後ろを滑って追いかける面 -->
        <div id="pill" aria-hidden="true"></div>
        <div id="items"></div>
        <span class="divider item" aria-hidden="true"></span>
        <button id="gear" class="icon-btn item" aria-label="設定" data-label="設定">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <path d="M10.3 3.6a1.7 1.7 0 0 1 3.4 0l.1.6a1.7 1.7 0 0 0 2.5 1.1l.5-.3a1.7 1.7 0 0 1 2.4 2.4l-.3.5a1.7 1.7 0 0 0 1.1 2.5l.6.1a1.7 1.7 0 0 1 0 3.4l-.6.1a1.7 1.7 0 0 0-1.1 2.5l.3.5a1.7 1.7 0 0 1-2.4 2.4l-.5-.3a1.7 1.7 0 0 0-2.5 1.1l-.1.6a1.7 1.7 0 0 1-3.4 0l-.1-.6a1.7 1.7 0 0 0-2.5-1.1l-.5.3a1.7 1.7 0 0 1-2.4-2.4l.3-.5a1.7 1.7 0 0 0-1.1-2.5l-.6-.1a1.7 1.7 0 0 1 0-3.4l.6-.1a1.7 1.7 0 0 0 1.1-2.5l-.3-.5a1.7 1.7 0 0 1 2.4-2.4l.5.3a1.7 1.7 0 0 0 2.5-1.1z"/>
            <circle cx="12" cy="12" r="2.8"/>
          </svg>
        </button>
      </nav>
    </div>

    <div id="hint" role="status"></div>

    <section id="panel" aria-labelledby="panel-title">
      <div id="panel-glass" aria-hidden="true"></div>
      <h1 id="panel-title" class="visually-hidden"></h1>
      <div id="views">
        <div id="settings" class="view" data-view="settings"><div id="settings-inner"></div></div>
      </div>
    </section>
  </div>
</body>
</html>
