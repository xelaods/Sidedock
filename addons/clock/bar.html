<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="http://addon.localhost/_sdk/sidedock.css">
<script src="http://addon.localhost/_sdk/sidedock.js"></script>
<style>
  /* 権限のいらない、いちばん小さなアドオンの例 */
  .clock { padding: 6px 0 8px; text-align: center; font-variant-numeric: tabular-nums; }
  #time { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
  #date { font-size: 10.5px; color: var(--sd-ink-2); line-height: 1.3; }
</style>
</head>
<body>
  <div class="clock" id="clock">
    <div id="time"></div>
    <div id="date"></div>
  </div>
<script>
  const WEEK = "日月火水木金土";
  function tick() {
    const d = new Date();
    document.getElementById("time").textContent =
      `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
    document.getElementById("date").textContent = `${d.getMonth() + 1}/${d.getDate()} ${WEEK[d.getDay()]}`;
    document.getElementById("clock").title = d.toLocaleDateString("ja-JP", { dateStyle: "full" });
    // 次の分の変わり目に合わせて更新
    setTimeout(tick, 60000 - (d.getSeconds() * 1000 + d.getMilliseconds()) + 50);
  }
  tick();
</script>
</body>
</html>
