<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="http://addon.localhost/_sdk/sidedock.css">
<script src="http://addon.localhost/_sdk/sidedock.js"></script>
<style>
  /* 権限のいらない、いちばん小さなアドオンの例 */
  body { padding: 0 8px 0 10px; gap: 8px; border-radius: 16px; cursor: default; transition: background 0.2s; }
  body:hover { background: var(--sd-hover); }
  body:active { background: var(--sd-press); }
  #date { font-size: 11.5px; color: var(--sd-ink-2); letter-spacing: 0.02em; }
  #time {
    font: 600 14px/1 var(--sd-font-display);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }
  /* 区切りのコロンがゆっくり明滅する */
  #time i { font-style: normal; display: inline-block; margin: 0 1px; animation: blink 2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
</style>
</head>
<body>
  <span id="date"></span>
  <span id="time"></span>
<script>
  const WEEK = "日月火水木金土";
  function tick() {
    const d = new Date();
    document.getElementById("date").textContent = `${d.getMonth() + 1}/${d.getDate()} ${WEEK[d.getDay()]}`;
    document.getElementById("time").innerHTML =
      `${d.getHours()}<i>:</i>${String(d.getMinutes()).padStart(2, "0")}`;
    document.body.dataset.hint = d.toLocaleDateString("ja-JP", { dateStyle: "full" });
    // 次の分の変わり目に合わせて更新
    setTimeout(tick, 60000 - (d.getSeconds() * 1000 + d.getMilliseconds()) + 50);
  }
  tick();
  // 押すとカレンダーを開く（Windows のタスクバーの時計と同じ）
  document.body.addEventListener("click", () => SideDock.ui.togglePanel());
</script>
</body>
</html>
