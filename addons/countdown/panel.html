<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="http://addon.localhost/_sdk/sidedock.css">
<script src="http://addon.localhost/_sdk/sidedock.js"></script>
<style>
  body { padding: 10px; }
  .ev { display: flex; align-items: center; gap: 10px; padding: 8px 6px 8px 10px; border-radius: 10px; }
  .ev:hover { background: var(--sd-hover); }
  .ev .d { width: 46px; flex: none; text-align: center; }
  .ev .d b { display: block; font: 700 18px/1 var(--sd-font-display); font-variant-numeric: tabular-nums; }
  .ev .d small { font-size: 9.5px; color: var(--sd-ink-3); }
  .ev.today .d b { color: var(--sd-accent); }
  .ev.past { opacity: 0.45; }
  .ev .m { flex: 1; min-width: 0; }
  .ev .n { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .w { font-size: 10.5px; color: var(--sd-ink-3); }
  .del { appearance: none; border: 0; background: transparent; color: var(--sd-ink-3); width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; cursor: default; opacity: 0; }
  .ev:hover .del { opacity: 1; }
  .del:hover { background: var(--sd-hover); color: var(--sd-ink); }
  .del svg { width: 11px; height: 11px; }
  form { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; margin-top: 8px; padding-top: 8px; box-shadow: inset 0 1px 0 var(--sd-line); }
  form .sd-input { min-height: 30px; font-size: 12px; }
  #date { width: 128px; }
  form .sd-btn { min-height: 30px; }
</style>
</head>
<body>
  <div id="list"></div>
  <form id="form" autocomplete="off">
    <input id="name" class="sd-input" placeholder="予定の名前（例 韓国旅行）" aria-label="予定の名前">
    <input id="date" class="sd-input" type="date" aria-label="日付">
    <button class="sd-btn primary">追加</button>
  </form>
<script type="module">
  import { daysUntil, label } from "./common.js";
  const $ = (id) => document.getElementById(id);
  const W = "日月火水木金土";
  const X = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>';
  let events = [];
  const save = () => SideDock.storage.set({ events });

  function render() {
    const list = events.map((e) => ({ ...e, days: daysUntil(e.date) })).sort((a, b) => (a.days < 0) - (b.days < 0) || Math.abs(a.days) - Math.abs(b.days));
    if (!list.length) { $("list").innerHTML = '<div class="sd-empty">旅行や試験の日を追加すると、カプセルに残り日数が出ます</div>'; return; }
    $("list").replaceChildren(...list.map((e) => {
      const row = document.createElement("div");
      row.className = `ev${e.days === 0 ? " today" : ""}${e.days < 0 ? " past" : ""}`;
      const [y, m, d] = e.date.split("-").map(Number);
      const wd = W[new Date(y, m - 1, d).getDay()];
      row.innerHTML = `<div class="d"><b>${e.days === 0 ? "今日" : Math.abs(e.days)}</b><small>${e.days === 0 ? "" : e.days > 0 ? "日後" : "日前"}</small></div><div class="m"><div class="n"></div><div class="w">${y}/${m}/${d}（${wd}）・${label(e.days)}</div></div><button class="del" aria-label="消す">${X}</button>`;
      row.querySelector(".n").textContent = e.name;
      row.querySelector(".del").addEventListener("click", () => { events = events.filter((x) => x.id !== e.id); save(); render(); });
      return row;
    }));
  }
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("name").value.trim(), date = $("date").value;
    if (!name || !date) return;
    events.push({ id: Date.now().toString(36), name, date });
    $("name").value = "";
    save(); render();
  });
  SideDock.on("panelShown", render);
  await SideDock.ready;
  events = (await SideDock.storage.get())?.events ?? [];
  render();
</script>
</body>
</html>
