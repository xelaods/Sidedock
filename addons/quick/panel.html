<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="http://addon.localhost/_sdk/sidedock.css">
<script src="http://addon.localhost/_sdk/sidedock.js"></script>
<style>
  body { padding: 12px; }
  /* 切り替えのタイル */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tile {
    position: relative; display: flex; align-items: center; gap: 0;
    border-radius: 12px; overflow: hidden;
    background: var(--sd-surface); box-shadow: inset 0 0 0 1px var(--sd-line);
    transition: background 0.25s, box-shadow 0.25s;
  }
  .tile.on { background: var(--sd-accent); box-shadow: 0 6px 16px -8px var(--sd-glow); }
  .tile.on, .tile.on .sub { color: var(--sd-accent-ink); }
  .tile.busy { opacity: 0.6; }
  .tile.na { opacity: 0.4; pointer-events: none; }
  .tile button { appearance: none; border: 0; background: transparent; color: inherit; font: inherit; cursor: default; }
  .tile .main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; padding: 10px 6px 10px 11px; text-align: left; }
  .tile .main:hover { background: color-mix(in srgb, currentColor 7%, transparent); }
  .tile .main svg { flex: none; width: 18px; height: 18px; }
  .tile .t { display: block; font-size: 12px; font-weight: 600; line-height: 1.2; }
  .tile .sub { display: block; font-size: 10.5px; color: var(--sd-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 92px; }
  .tile .more { width: 28px; align-self: stretch; display: grid; place-items: center; box-shadow: inset 1px 0 0 color-mix(in srgb, currentColor 15%, transparent); }
  .tile .more:hover { background: color-mix(in srgb, currentColor 10%, transparent); }
  .tile .more svg { width: 11px; height: 11px; transition: transform 0.3s var(--sd-ease); }
  .tile.open .more svg { transform: rotate(90deg); }

  /* Wi-Fi の一覧 */
  #nets { margin-top: 6px; border-radius: 12px; background: var(--sd-surface-2); box-shadow: inset 0 0 0 1px var(--sd-line); padding: 4px; }
  #nets[hidden] { display: none; }
  .net { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 8px; cursor: default; font-size: 12px; }
  .net:hover { background: var(--sd-hover); }
  .net svg { width: 15px; height: 15px; flex: none; }
  .net .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .net .s { font-size: 10.5px; color: var(--sd-ink-3); }
  .net.connected .s { color: var(--sd-accent); }
  .net.busy { opacity: 0.55; }
  .nets-foot { display: flex; justify-content: space-between; padding: 4px 6px 2px; font-size: 10.5px; color: var(--sd-ink-3); }
  .nets-foot button { appearance: none; border: 0; background: transparent; color: var(--sd-ink-2); font: inherit; font-size: 10.5px; cursor: default; padding: 2px 4px; border-radius: 5px; }
  .nets-foot button:hover { background: var(--sd-hover); color: var(--sd-ink); }

  /* スライダー */
  .slider { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .slider[hidden] { display: none; }
  .slider .ic { width: 28px; height: 28px; border-radius: 14px; display: grid; place-items: center; flex: none; color: var(--sd-ink-2); }
  button.ic { appearance: none; border: 0; background: transparent; cursor: default; }
  button.ic:hover { background: var(--sd-hover); color: var(--sd-ink); }
  .slider .ic svg { width: 17px; height: 17px; }
  .slider .v { width: 3ch; text-align: right; font: 600 12px/1 var(--sd-font-display); font-variant-numeric: tabular-nums; color: var(--sd-ink-2); }

  .foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-top: 10px; box-shadow: inset 0 1px 0 var(--sd-line); font-size: 11px; color: var(--sd-ink-2); }
  .foot #batline { flex: 1; display: flex; align-items: center; gap: 6px; }
  .foot #batline:empty { visibility: hidden; }
  .foot .sd-btn { min-height: 26px; font-size: 11px; padding: 0 9px; }
  #err { margin: 8px 2px 0; font-size: 10.5px; color: var(--sd-danger); }
  #err:empty { display: none; }
</style>
</head>
<body>
  <div class="tiles">
    <div class="tile" id="t-wifi">
      <button class="main" id="wifi-toggle"><span id="wifi-ic"></span><span><span class="t">Wi-Fi</span><span class="sub" id="wifi-sub">…</span></span></button>
      <button class="more" id="wifi-more" aria-label="Wi-Fi の一覧"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg></button>
    </div>
    <div class="tile" id="t-bt">
      <button class="main" id="bt-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7.5l10 9-5 4v-17l5 4-10 9"/></svg><span><span class="t">Bluetooth</span><span class="sub" id="bt-sub">…</span></span></button>
      <button class="more" id="bt-more" aria-label="Bluetooth の設定"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg></button>
    </div>
    <div class="tile" id="t-dark">
      <button class="main" id="dark-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span><span class="t">ダークモード</span><span class="sub" id="dark-sub">…</span></span></button>
    </div>
    <div class="tile" id="t-net">
      <button class="main" id="net-open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 3.7 5.4 3.7 8.5s-1.2 5.9-3.7 8.5c-2.5-2.6-3.7-5.4-3.7-8.5S9.5 6.1 12 3.5z"/></svg><span><span class="t">ネットワーク</span><span class="sub" id="net-sub">…</span></span></button>
    </div>
  </div>
  <div id="nets" hidden></div>

  <div class="slider">
    <button class="ic" id="mute" aria-label="ミュート"></button>
    <input id="vol" class="sd-range" type="range" min="0" max="100" aria-label="音量">
    <span class="v" id="vol-v"></span>
  </div>
  <div class="slider" id="bright-row" hidden>
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg></span>
    <input id="bright" class="sd-range" type="range" min="0" max="100" aria-label="画面の明るさ">
    <span class="v" id="bright-v"></span>
  </div>

  <div class="foot">
    <span id="batline"></span>
    <button class="sd-btn" id="more-settings">その他の設定</button>
  </div>
  <p id="err"></p>

<script type="module">
  import { netIcon, volIcon, batIcon } from "./icons.js";
  const $ = (id) => document.getElementById(id);
  const err = (m) => { $("err").textContent = m || ""; };
  let radios = [], net = null, vol = null;

  // ------------------------------------------------ Wi-Fi / Bluetooth / ダークモード
  const radio = (k) => radios.find((r) => r.kind === k);

  function renderTiles() {
    const wifi = radio("wifi"), bt = radio("bluetooth");
    $("wifi-ic").innerHTML = netIcon(wifi && !wifi.on ? { kind: "none" } : net?.kind === "wifi" ? net : { kind: "wifi", bars: 4, internet: true }, 18);
    $("t-wifi").classList.toggle("on", !!wifi?.on);
    $("t-wifi").classList.toggle("na", !wifi);
    $("wifi-sub").textContent = !wifi ? "ありません" : !wifi.on ? "オフ" : net?.kind === "wifi" ? net.ssid || "接続中" : "未接続";
    $("t-bt").classList.toggle("on", !!bt?.on);
    $("t-bt").classList.toggle("na", !bt);
    $("bt-sub").textContent = !bt ? "ありません" : bt.on ? "オン" : "オフ";
    $("net-sub").textContent = !net || net.kind === "none" ? "未接続" : net.kind === "ethernet" ? "有線 LAN" : net.internet ? "インターネット接続" : "インターネットなし";
  }

  async function loadRadios() {
    [radios, net] = await Promise.all([SideDock.radios.get().catch(() => []), SideDock.net.status().catch(() => null)]);
    renderTiles();
  }

  async function toggleRadio(kind) {
    const r = radio(kind);
    if (!r) return;
    const tile = $(kind === "wifi" ? "t-wifi" : "t-bt");
    tile.classList.add("busy");
    err();
    try {
      await SideDock.radios.set(kind, !r.on);
      r.on = !r.on;
      renderTiles();
    } catch (e) { err(e.message); }
    tile.classList.remove("busy");
    setTimeout(loadRadios, 1200);
  }
  $("wifi-toggle").addEventListener("click", () => toggleRadio("wifi"));
  $("bt-toggle").addEventListener("click", () => toggleRadio("bluetooth"));
  $("bt-more").addEventListener("click", () => openSettings("ms-settings:bluetooth"));
  $("net-open").addEventListener("click", () => openSettings("ms-settings:network-status"));

  let dark = false;
  async function loadDark() {
    dark = await SideDock.theme.getDark().catch(() => false);
    $("t-dark").classList.toggle("on", dark);
    $("dark-sub").textContent = dark ? "オン" : "オフ";
  }
  $("dark-toggle").addEventListener("click", async () => {
    dark = !dark;
    $("t-dark").classList.toggle("on", dark);
    $("dark-sub").textContent = dark ? "オン" : "オフ";
    await SideDock.theme.setDark(dark).catch((e) => err(e.message));
  });

  // ------------------------------------------------ Wi-Fi の一覧
  const lock = '<path d="M8 11V8.5a4 4 0 0 1 8 0V11"/><rect x="6" y="11" width="12" height="9" rx="2"/>';
  async function loadNets() {
    const box = $("nets");
    let list;
    try { list = await SideDock.wifi.list(); }
    catch (e) { box.innerHTML = `<div class="sd-empty">${e.message}</div>`; return; }
    const rows = list.slice(0, 12).map((n) => {
      const row = document.createElement("div");
      row.className = `net${n.connected ? " connected" : ""}`;
      const bars = n.signal >= 75 ? 4 : n.signal >= 50 ? 3 : n.signal >= 25 ? 2 : 1;
      row.innerHTML = `${netIcon({ kind: "wifi", bars, internet: true }, 15)}<span class="n"></span><span class="s"></span>${n.secured ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:11px;height:11px;opacity:.5">${lock}</svg>` : ""}`;
      row.querySelector(".n").textContent = n.ssid;
      row.querySelector(".s").textContent = n.connected ? "接続中" : n.saved ? "保存済み" : "";
      row.title = n.connected ? "接続中" : n.saved ? "クリックでつなぐ" : "クリックすると Windows の画面でつなげます";
      row.addEventListener("click", async () => {
        if (n.connected) return;
        row.classList.add("busy");
        row.querySelector(".s").textContent = "接続中…";
        try {
          await SideDock.wifi.connect(n.ssid);
          setTimeout(() => { loadNets(); loadRadios(); }, 2500);
        } catch (e) {
          // 保存されていないネットワークは、パスワードを入れるために Windows の画面を開く
          if (e.message === "unsaved") openSettings("ms-availablenetworks:");
          else { err(e.message); row.classList.remove("busy"); row.querySelector(".s").textContent = ""; }
        }
      });
      return row;
    });
    const foot = document.createElement("div");
    foot.className = "nets-foot";
    foot.innerHTML = `<span>${list.length ? `${list.length} 件` : "見つかりません"}</span><button>Wi-Fi の設定</button>`;
    foot.querySelector("button").addEventListener("click", () => openSettings("ms-settings:network-wifi"));
    box.replaceChildren(...rows, foot);
  }
  $("wifi-more").addEventListener("click", () => {
    const box = $("nets");
    box.hidden = !box.hidden;
    $("t-wifi").classList.toggle("open", !box.hidden);
    if (!box.hidden) { box.innerHTML = '<div class="sd-empty">探しています…</div>'; loadNets(); }
  });

  // ------------------------------------------------ 音量と明るさ
  function renderVol() {
    if (!vol) return;
    const pct = Math.round(vol.level * 100);
    if (!draggingVol) { $("vol").value = pct; SideDock.ui.paintRange($("vol")); }
    $("vol-v").textContent = vol.muted ? "−" : pct;
    $("mute").innerHTML = volIcon(vol, 17);
  }
  let draggingVol = false, sendingVol = false;
  $("vol").addEventListener("input", async () => {
    draggingVol = true;
    vol = { level: Number($("vol").value) / 100, muted: false };
    renderVol();
    if (sendingVol) return;
    sendingVol = true;
    let sent = -1;
    while (sent !== vol.level) { sent = vol.level; await SideDock.volume.set(sent).catch(() => {}); }
    sendingVol = false;
  });
  $("vol").addEventListener("change", () => { draggingVol = false; });
  $("mute").addEventListener("click", async () => {
    if (!vol) return;
    vol = { ...vol, muted: !vol.muted };
    renderVol();
    await SideDock.volume.setMute(vol.muted).catch(() => {});
  });
  SideDock.on("volumeChanged", (v) => { if (v && typeof v.level === "number" && !draggingVol) { vol = v; renderVol(); } });

  // 明るさは画面への命令が遅いので、動かし終わるまで間引いて送る
  let brightTimer = 0;
  $("bright").addEventListener("input", () => {
    $("bright-v").textContent = $("bright").value;
    clearTimeout(brightTimer);
    brightTimer = setTimeout(() => SideDock.brightness.set(Number($("bright").value)).catch((e) => err(e.message)), 120);
  });
  async function loadBright() {
    const b = await SideDock.brightness.get().catch(() => null);
    $("bright-row").hidden = b == null;
    if (b != null) { $("bright").value = b; $("bright-v").textContent = b; SideDock.ui.paintRange($("bright")); }
  }

  // ------------------------------------------------ バッテリーとその他
  async function loadBattery() {
    const b = await SideDock.battery.get().catch(() => null);
    $("batline").innerHTML = b ? `${batIcon(b, 16)}<span>${b.level}%${b.charging ? "・充電中" : ""}</span>` : "";
  }
  function openSettings(uri) {
    SideDock.ui.dismiss();
    SideDock.app.launch(uri).catch(() => SideDock.shell.action("quick"));
  }
  $("more-settings").addEventListener("click", () => { SideDock.ui.dismiss(); SideDock.shell.action("quick").catch(() => {}); });

  SideDock.on("networkChanged", loadRadios);
  SideDock.on("panelShown", async () => {
    err();
    $("nets").hidden = true;
    $("t-wifi").classList.remove("open");
    loadRadios(); loadDark(); loadBattery(); loadBright();
    vol = await SideDock.volume.get().catch(() => null);
    renderVol();
  });
</script>
</body>
</html>
