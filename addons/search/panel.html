<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="http://addon.localhost/_sdk/sidedock.css">
<script src="http://addon.localhost/_sdk/sidedock.js"></script>
<style>
  body { padding: 12px; }
  .box { position: relative; }
  .box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--sd-ink-3); pointer-events: none; transition: color 0.2s; }
  .box:focus-within svg { color: var(--sd-accent); }
  #q { min-height: 38px; padding-left: 34px; font-size: 14px; border-radius: 12px; }
  #q::-webkit-search-cancel-button { display: none; }

  .row { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .engines { display: flex; flex-wrap: nowrap; gap: 3px; flex: 1; }
  .engines button {
    appearance: none; font: inherit; font-size: 11px; line-height: 20px;
    flex: none; padding: 0 7px; border-radius: 10px; cursor: default;
    border: 0; background: transparent; color: var(--sd-ink-3);
    box-shadow: inset 0 0 0 1px var(--sd-line);
    transition: background 0.2s, color 0.2s, box-shadow 0.2s;
  }
  .engines button:hover { color: var(--sd-ink); background: var(--sd-hover); }
  .engines button[aria-pressed="true"] {
    background: color-mix(in srgb, var(--sd-accent) 18%, transparent);
    color: var(--sd-accent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--sd-accent) 40%, transparent);
  }
  .foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .foot label { flex: none; font-size: 11px; color: var(--sd-ink-3); }
  #browser { min-height: 26px; font-size: 11.5px; padding: 0 8px; border-radius: 8px; }

  #custom-wrap[hidden] { display: none; }
  #custom { min-height: 30px; font-size: 12px; margin-top: 8px; }
  #status { margin: 8px 2px 0; font-size: 11px; }
  #status:empty { display: none; }
  #status.error { color: var(--sd-danger); }
</style>
</head>
<body>
  <form id="form" autocomplete="off">
    <div class="box">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
      <input id="q" class="sd-input" type="search" placeholder="検索するか URL を入力" aria-label="検索語または URL" spellcheck="false">
    </div>
    <div class="row">
      <div class="engines" id="engines" role="group" aria-label="検索エンジン"></div>
    </div>
    <div id="custom-wrap" hidden>
      <input id="custom" class="sd-input" placeholder="検索 URL（検索語の位置に %s）" aria-label="カスタムの検索 URL">
    </div>
    <div class="foot">
      <label for="browser">開くブラウザ</label>
      <select id="browser" class="sd-select"></select>
    </div>
  </form>
  <p id="status" class="sd-muted"></p>

<script type="module">
  const ENGINES = [
    { id: "google", name: "Google", url: "https://www.google.com/search?q=%s" },
    { id: "bing", name: "Bing", url: "https://www.bing.com/search?q=%s" },
    { id: "yahoo", name: "Yahoo!", url: "https://search.yahoo.co.jp/search?p=%s" },
    { id: "youtube", name: "YouTube", url: "https://www.youtube.com/results?search_query=%s" },
    { id: "wikipedia", name: "Wikipedia", url: "https://ja.wikipedia.org/w/index.php?search=%s" },
    { id: "custom", name: "その他", url: "" },
  ];

  const $ = (id) => document.getElementById(id);
  let prefs = { engine: "google", browserId: "", custom: "" };

  const save = () => SideDock.storage.set(prefs);

  function renderEngines() {
    $("engines").replaceChildren(...ENGINES.map((e) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = e.name;
      b.setAttribute("aria-pressed", String(prefs.engine === e.id));
      b.addEventListener("click", () => {
        prefs.engine = e.id;
        renderEngines();
        save();
        $("q").focus();
      });
      return b;
    }));
    $("custom-wrap").hidden = prefs.engine !== "custom";
    $("q").placeholder = `${(ENGINES.find((e) => e.id === prefs.engine) ?? ENGINES[0]).name} で検索、または URL`;
  }

  async function renderBrowsers() {
    const list = await SideDock.browser.list().catch(() => []);
    const options = [{ id: "", name: "既定のブラウザ" }, ...list];
    // 保存していたブラウザがアンインストールされていたら既定に戻す
    if (!options.some((o) => o.id === prefs.browserId)) prefs.browserId = "";
    $("browser").replaceChildren(...options.map((o) => new Option(o.name, o.id, false, o.id === prefs.browserId)));
  }

  /** 入力が URL ならそのまま、そうでなければ検索 URL を作る */
  function toUrl(text) {
    if (/^https?:\/\//i.test(text)) return text;
    if (!/\s/.test(text) && /^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/.test(text)) return `https://${text}`;
    if (/^localhost(:\d+)?(\/\S*)?$/i.test(text)) return `http://${text}`;
    const engine = ENGINES.find((e) => e.id === prefs.engine) ?? ENGINES[0];
    const template = engine.id === "custom" ? prefs.custom : engine.url;
    if (!template.includes("%s") || !/^https?:\/\//i.test(template)) {
      throw new Error("カスタムの検索 URL は https:// で始め、%s を含めてください");
    }
    return template.replace("%s", encodeURIComponent(text));
  }

  function setStatus(text, error = false) {
    $("status").textContent = text;
    $("status").classList.toggle("error", error);
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = $("q").value.trim();
    if (!text) return;
    try {
      await SideDock.browser.open(toUrl(text), prefs.browserId || undefined);
      $("q").value = "";
      setStatus("");
      SideDock.ui.dismiss();
    } catch (err) {
      setStatus(err.message, true);
    }
  });

  $("browser").addEventListener("change", () => { prefs.browserId = $("browser").value; save(); });
  $("custom").addEventListener("change", () => { prefs.custom = $("custom").value.trim(); save(); });

  // パネルを開くたびに入力欄へカーソルを置く
  // パネルが開いたらキーボード入力を受け取り、すぐ打ち込めるようにする
  SideDock.on("panelShown", async () => {
    setStatus("");
    await SideDock.ui.focus().catch(() => {});
    $("q").focus();
    $("q").select();
  });

  await SideDock.ready;
  prefs = { ...prefs, ...((await SideDock.storage.get()) ?? {}) };
  $("custom").value = prefs.custom;
  renderEngines();
  await renderBrowsers();
</script>
</body>
</html>
