<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="http://addon.localhost/_sdk/sidedock.css">
<script src="http://addon.localhost/_sdk/sidedock.js"></script>
<!-- QR コードの生成：qrcode-generator（Kazuhiko Arase, MIT License） -->
<script src="qrcode.js"></script>
<style>
  body { padding: 12px; }
  .code {
    display: grid; place-items: center; width: 100%; aspect-ratio: 1; border-radius: 14px;
    background: #fff; box-shadow: 0 8px 24px -10px rgba(0, 0, 0, 0.5);
    transition: transform 0.4s var(--sd-ease);
  }
  .code.fresh { animation: pop 0.45s var(--sd-ease); }
  @keyframes pop { from { transform: scale(0.94); opacity: 0.4; } }
  .code svg { width: 88%; height: 88%; }
  .code .msg { color: #555; font-size: 12px; padding: 20px; text-align: center; }
  #text { margin-top: 10px; width: 100%; min-height: 54px; max-height: 90px; resize: none; padding: 8px 10px; border: 0; border-radius: 10px; background: var(--sd-surface); color: var(--sd-ink); box-shadow: inset 0 0 0 1px var(--sd-line); font: 12px/1.45 var(--sd-font); user-select: text; }
  #text:focus { outline: none; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--sd-accent) 60%, transparent); }
  .note { margin: 6px 2px 0; font-size: 10.5px; color: var(--sd-ink-3); }
</style>
</head>
<body>
  <div class="code" id="code"></div>
  <textarea id="text" placeholder="URL や文字を入力（開いたときは、最後にコピーしたものが入ります）" spellcheck="false" aria-label="QR にする文字"></textarea>
  <p class="note" id="note"></p>
<script type="module">
  const $ = (id) => document.getElementById(id);
  function draw(fresh) {
    const text = $("text").value.trim();
    if (!text) { $("code").innerHTML = '<div class="msg">文字を入れると QR コードになります</div>'; $("note").textContent = ""; return; }
    try {
      const qr = qrcode(0, "M");
      qr.addData(text, "Byte");
      qr.make();
      $("code").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
      $("note").textContent = `${text.length} 文字・スマホのカメラで読み取れます`;
      if (fresh) { $("code").classList.remove("fresh"); void $("code").offsetWidth; $("code").classList.add("fresh"); }
    } catch {
      $("code").innerHTML = '<div class="msg">長すぎて QR コードにできません</div>';
    }
  }
  let timer = 0;
  $("text").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => draw(false), 150); });
  SideDock.on("panelShown", async () => {
    // 最後にコピーした文字を入れる（URL を優先）
    const list = await SideDock.clipboard.list().catch(() => []);
    const pick = list.find((c) => /^https?:\/\//.test(c.text.trim())) ?? list[0];
    if (pick && pick.text !== $("text").value) { $("text").value = pick.text.slice(0, 1500); draw(true); }
    else draw(false);
  });
  draw(false);
</script>
</body>
</html>
