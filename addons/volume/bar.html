<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="http://addon.localhost/_sdk/sidedock.css">
<script src="http://addon.localhost/_sdk/sidedock.js"></script>
<style>
  #btn { width: auto; padding: 0 10px 0 7px; gap: 7px; display: inline-flex; align-items: center; }
  #btn:hover { transform: none; }
  #btn.muted { color: var(--sd-ink-3); }
  /* 小さな音量メーター */
  .meter {
    position: relative; width: 30px; height: 4px; border-radius: 2px;
    background: var(--sd-line); overflow: hidden;
  }
  .meter b {
    position: absolute; inset: 0; border-radius: inherit;
    background: currentColor;
    transform-origin: 0 50%;
    transform: scaleX(var(--v, 0));
    transition: transform 0.45s var(--sd-ease);
  }
  #btn.muted .meter b { opacity: 0.35; }
  /* スクロールで動かしている間はメーターが光る */
  #btn.busy .meter b { background: var(--sd-accent); box-shadow: 0 0 8px var(--sd-glow); transition-duration: 0.12s; }
</style>
</head>
<body>
  <button id="btn" class="sd-bar-btn" aria-label="音量">
    <span id="icon"></span>
    <span class="meter" aria-hidden="true"><b id="fill"></b></span>
  </button>
<script type="module">
  import { speaker } from "./speaker.js";

  const btn = document.getElementById("btn");
  let current = { level: 0, muted: false };
  let busyTimer = 0;

  function render() {
    const pct = Math.round(current.level * 100);
    document.getElementById("icon").innerHTML = speaker(current.level, current.muted, 18);
    document.getElementById("fill").style.setProperty("--v", current.muted ? 0 : current.level);
    btn.classList.toggle("muted", current.muted);
    btn.dataset.hint = current.muted ? "ミュート中" : `音量 ${pct}%`;
  }

  async function refresh() {
    try {
      current = await SideDock.volume.get();
      render();
    } catch {}
  }

  // ホイールで 2% ずつ（Shift を押しながらで 10% ずつ）
  let sending = false;
  btn.addEventListener("wheel", async (e) => {
    e.preventDefault();
    const step = (e.shiftKey ? 10 : 2) / 100;
    const level = Math.min(1, Math.max(0, Math.round((current.level + (e.deltaY < 0 ? step : -step)) * 100) / 100));
    current = { level, muted: level > 0 ? false : current.muted };
    render();
    SideDock.ui.hint(`音量 ${Math.round(level * 100)}%`, btn.offsetWidth / 2);
    btn.classList.add("busy");
    clearTimeout(busyTimer);
    busyTimer = setTimeout(() => btn.classList.remove("busy"), 500);
    if (sending) return;
    sending = true;
    // 回している間に変わった分も、最後の値まで確実に送る
    let sent = -1;
    while (sent !== current.level) {
      sent = current.level;
      await SideDock.volume.set(sent).catch(() => {});
    }
    sending = false;
  }, { passive: false });

  // クリックでミュートの切り替え（近づけるとスライダーのパネルが開く）
  btn.addEventListener("click", async () => {
    await SideDock.volume.setMute(!current.muted).catch(() => {});
    refresh();
  });

  // 他のアプリやキーボードで変えた音量にも追いつく（隠れている間は調べない）
  SideDock.poll(() => (sending ? null : refresh()), { visible: 1500, hidden: 0 });
</script>
</body>
</html>
