<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="http://addon.localhost/_sdk/sidedock.css">
<script src="http://addon.localhost/_sdk/sidedock.js"></script>
<style>
  #btn { height: 48px; grid-template-rows: 22px 14px; align-content: center; gap: 1px; }
  #btn svg { display: block; }
  #pct { font-size: 10.5px; line-height: 14px; color: var(--sd-ink-2); font-variant-numeric: tabular-nums; }
  #btn.muted { color: var(--sd-ink-3); }
</style>
</head>
<body>
  <button id="btn" class="sd-bar-btn" aria-label="音量">
    <span id="icon"></span>
    <span id="pct">--</span>
  </button>
<script type="module">
  import { speaker } from "./speaker.js";

  const btn = document.getElementById("btn");
  let current = { level: 0, muted: false };

  function render() {
    const pct = Math.round(current.level * 100);
    document.getElementById("icon").innerHTML = speaker(current.level, current.muted);
    document.getElementById("pct").textContent = current.muted ? "消音" : String(pct);
    btn.classList.toggle("muted", current.muted);
    btn.title = current.muted ? "ミュート中（クリックで調整）" : `音量 ${pct}%（スクロールで調整）`;
  }

  async function refresh() {
    try {
      current = await SideDock.volume.get();
      render();
    } catch {
      document.getElementById("pct").textContent = "--";
    }
  }

  // ホイールで 2% ずつ（Shift を押しながらで 10% ずつ）
  let busy = false;
  btn.addEventListener("wheel", async (e) => {
    e.preventDefault();
    if (busy) return;
    busy = true;
    const step = (e.shiftKey ? 10 : 2) / 100;
    const level = Math.min(1, Math.max(0, Math.round((current.level + (e.deltaY < 0 ? step : -step)) * 100) / 100));
    current = { level, muted: level > 0 ? false : current.muted };
    render();
    await SideDock.volume.set(level).catch(() => {});
    busy = false;
  }, { passive: false });

  btn.addEventListener("click", () => SideDock.ui.openPanel());
  // 中クリックでミュートの切り替え
  btn.addEventListener("auxclick", async (e) => {
    if (e.button !== 1) return;
    await SideDock.volume.setMute(!current.muted).catch(() => {});
    refresh();
  });

  await SideDock.ready;
  refresh();
  // 他のアプリやキーボードで変えた音量にも追いつく
  setInterval(() => { if (!busy) refresh(); }, 1500);
</script>
</body>
</html>
