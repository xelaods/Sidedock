<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="http://addon.localhost/_sdk/sidedock.css">
<script src="http://addon.localhost/_sdk/sidedock.js"></script>
<style>
  body { padding: 0 2px; gap: 1px; }
  .sd-bar-btn svg { width: 16px; height: 16px; }
  #quick { width: auto; padding: 0 9px; gap: 7px; display: inline-flex; border-radius: 16px; }
  #quick:hover { transform: none; }
  #tray svg { transition: transform 0.3s var(--sd-ease); }
  #tray:hover svg { transform: translateY(-1.5px); }
</style>
</head>
<body>
  <button id="tray" class="sd-bar-btn" aria-label="トレイのアイコン" data-hint="隠れているアイコン">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
  </button>
  <button id="quick" class="sd-bar-btn" aria-label="クイック設定" data-hint="Wi-Fi・音量・電源など">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 9a13.5 13.5 0 0 1 18 0M6 12.5a9 9 0 0 1 12 0M9 16a4.5 4.5 0 0 1 6 0"/><circle cx="12" cy="19" r=".9" fill="currentColor"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9.5h3l4.5-4v13L7 14.5H4z"/><path d="M15 9a4 4 0 0 1 0 6"/></svg>
  </button>
  <button id="notif" class="sd-bar-btn" aria-label="通知センター" data-hint="通知とカレンダー">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg>
  </button>
<script type="module">
  const act = (a) => () => SideDock.shell.action(a).catch(() => {});
  document.getElementById("tray").addEventListener("click", act("tray"));
  document.getElementById("quick").addEventListener("click", act("quick"));
  document.getElementById("notif").addEventListener("click", act("notifications"));
</script>
</body>
</html>
