<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="http://addon.localhost/_sdk/sidedock.css">
<script src="http://addon.localhost/_sdk/sidedock.js"></script>
<style>
  body { padding: 10px; }
  #grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
  .ti { width: 36px; height: 36px; border-radius: 10px; }
  .ti img { width: 20px !important; height: 20px !important; }
  .ti-letter { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font-size: 10px; font-weight: 600; background: var(--sd-surface); color: var(--sd-ink-2); }
  .note { margin: 8px 2px 0; font-size: 10.5px; color: var(--sd-ink-3); line-height: 1.5; }
</style>
</head>
<body>
  <div id="grid"></div>
  <p class="note">クリックで開く・右クリックでメニュー。カプセルには左から 5 個まで並びます。</p>
<script type="module">
  import { trayButton } from "./common.js";
  const $ = (id) => document.getElementById(id);
  async function load() {
    const running = await SideDock.tray.running().catch(() => false);
    if (!running) {
      const e = document.createElement("div");
      e.className = "sd-empty";
      e.textContent = "設定の「タスクバーの代わりにする」をオンにすると、ここにトレイのアイコンが並びます";
      $("grid").style.display = "block";
      return $("grid").replaceChildren(e);
    }
    const list = await SideDock.tray.list().catch(() => []);
    $("grid").style.display = "";
    if (!list.length) {
      const e = document.createElement("div"); e.className = "sd-empty"; e.textContent = "トレイのアイコンはありません";
      $("grid").style.display = "block";
      return $("grid").replaceChildren(e);
    }
    $("grid").replaceChildren(...list.map((t) => trayButton(t, { size: 20 })));
  }
  SideDock.on("panelShown", load);
  SideDock.on("trayChanged", load);
</script>
</body>
</html>
