<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="http://addon.localhost/_sdk/sidedock.css">
<script src="http://addon.localhost/_sdk/sidedock.js"></script>
<style>
  body { padding: 12px 14px 14px; }
  .row { margin-bottom: 12px; }
  .row:last-of-type { margin-bottom: 0; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .name { font-size: 12px; color: var(--sd-ink-2); }
  .val { font: 600 15px/1 var(--sd-font-display); font-variant-numeric: tabular-nums; }
  .sub { font-size: 10.5px; color: var(--sd-ink-3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track { margin-top: 6px; height: 5px; border-radius: 3px; background: var(--sd-line); overflow: hidden; }
  .track b { display: block; height: 100%; width: calc(var(--v, 0) * 1%); border-radius: inherit; background: var(--sd-accent); transition: width 0.9s var(--sd-ease), background 0.3s; }
  .warm .track b { background: #f5b14c; }
  .hot .track b { background: #ff6b6b; }
  /* CPU の推移 */
  svg.spark { display: block; width: 100%; height: 34px; margin-top: 6px; }
  svg.spark path.line { fill: none; stroke: var(--sd-accent); stroke-width: 1.5; stroke-linejoin: round; }
  svg.spark path.area { fill: color-mix(in srgb, var(--sd-accent) 16%, transparent); stroke: none; }
  .foot { margin-top: 12px; font-size: 10.5px; color: var(--sd-ink-3); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="row" id="cpu">
    <div class="top"><span class="name">CPU</span><span class="val" id="cpuv">--</span></div>
    <svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none" aria-hidden="true"><path class="area" id="area"/><path class="line" id="line"/></svg>
    <div class="sub" id="cpus"></div>
  </div>
  <div class="row" id="mem">
    <div class="top"><span class="name">メモリ</span><span class="val" id="memv">--</span></div>
    <div class="track"><b></b></div>
    <div class="sub" id="mems"></div>
  </div>
  <div class="row" id="disk">
    <div class="top"><span class="name">ディスク（C:）</span><span class="val" id="diskv">--</span></div>
    <div class="track"><b></b></div>
    <div class="sub" id="disks"></div>
  </div>
  <div class="row" id="bat" hidden>
    <div class="top"><span class="name" id="batn">バッテリー</span><span class="val" id="batv">--</span></div>
    <div class="track"><b></b></div>
  </div>
  <div class="foot" id="up"></div>
<script type="module">
  import { bytes, level, uptime } from "./common.js";
  const $ = (id) => document.getElementById(id);
  const hist = [];
  let timer = 0;

  function spark() {
    const n = 30, pts = hist.slice(-n);
    if (pts.length < 2) return;
    const step = 100 / (n - 1), off = (n - pts.length) * step;
    const xy = pts.map((v, i) => `${(off + i * step).toFixed(1)},${(34 - (v / 100) * 32 - 1).toFixed(1)}`);
    $("line").setAttribute("d", `M${xy.join("L")}`);
    $("area").setAttribute("d", `M${off.toFixed(1)},34L${xy.join("L")}L100,34Z`);
  }

  async function tick() {
    try {
      const s = await SideDock.system.stats();
      hist.push(s.cpu);
      if (hist.length > 60) hist.shift();
      $("cpuv").textContent = `${Math.round(s.cpu)}%`;
      $("cpu").className = `row ${level(s.cpu)}`;
      $("cpus").textContent = `${s.cpuName}・${s.cores} スレッド`;
      spark();
      const mp = (s.memUsed / s.memTotal) * 100;
      $("memv").textContent = `${Math.round(mp)}%`;
      $("mem").className = `row ${level(mp)}`;
      $("mem").style.setProperty("--v", mp.toFixed(0));
      $("mems").textContent = `${bytes(s.memUsed)} / ${bytes(s.memTotal)} 使用中`;
      const dp = s.diskTotal ? (s.diskUsed / s.diskTotal) * 100 : 0;
      $("diskv").textContent = `${Math.round(dp)}%`;
      $("disk").className = `row ${level(dp)}`;
      $("disk").style.setProperty("--v", dp.toFixed(0));
      $("disks").textContent = `空き ${bytes(s.diskTotal - s.diskUsed)}（全体 ${bytes(s.diskTotal)}）`;
      $("bat").hidden = s.battery == null;
      if (s.battery != null) {
        $("batv").textContent = `${s.battery}%`;
        $("batn").textContent = s.charging ? "バッテリー（充電中）" : "バッテリー";
        $("bat").className = `row ${s.charging ? "" : s.battery <= 15 ? "hot" : s.battery <= 30 ? "warm" : ""}`;
        $("bat").style.setProperty("--v", s.battery);
      }
      $("up").textContent = `起動してから ${uptime(s.uptime)}`;
    } catch (e) {
      $("up").textContent = e.message;
    }
  }
  SideDock.on("panelShown", () => { tick(); clearInterval(timer); timer = setInterval(tick, 1000); });
  SideDock.on("panelHidden", () => clearInterval(timer));
  await SideDock.ready;
  tick();
</script>
</body>
</html>
