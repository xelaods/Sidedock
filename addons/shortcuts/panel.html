<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="http://addon.localhost/_sdk/sidedock.css">
<script src="http://addon.localhost/_sdk/sidedock.js"></script>
<style>
  .add { display: flex; gap: 6px; margin: 0 0 8px; }
  .add .sd-btn { flex: 1; }
  .hint { margin: 0 2px 10px; font-size: 11px; color: var(--sd-ink-3); }

  .item {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 2px 5px 8px;
    border-radius: var(--sd-radius);
  }
  .item { transition: background 0.2s; }
  .item:hover { background: var(--sd-hover); }
  .item img, .item .fallback { width: 20px; height: 20px; flex: none; }
  .item .fallback {
    display: grid; place-items: center; border-radius: 5px;
    background: var(--sd-surface); box-shadow: inset 0 0 0 1px var(--sd-line);
    font-size: 12px; font-weight: 600; color: var(--sd-ink-2);
  }
  .text { flex: 1; min-width: 0; }
  .name {
    width: 100%; padding: 1px 4px; margin-left: -4px;
    border: 1px solid transparent; border-radius: 4px;
    background: transparent; color: var(--sd-ink); font: inherit; font-size: 12.5px;
    user-select: text;
  }
  .name:hover { border-color: var(--sd-line); }
  .name:focus { outline: none; border-color: var(--sd-accent); background: var(--sd-surface); }
  .path { font-size: 11.5px; color: var(--sd-ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tools { display: flex; opacity: 0; transition: opacity 0.2s; }
  .item:hover .tools, .item:focus-within .tools { opacity: 1; }
  .tools .sd-btn { width: 26px; min-height: 26px; height: 26px; }
  .tools svg { width: 12px; height: 12px; }
</style>
</head>
<body>
  <div class="add">
    <button id="add-app" class="sd-btn primary">アプリを追加</button>
    <button id="add-folder" class="sd-btn">フォルダを追加</button>
  </div>
  <p class="hint">バーにアプリやショートカットをドラッグしても追加できます。名前はクリックして書き換えられます。</p>
  <div id="list"></div>

<script type="module">
  import { load, save, addPaths } from "./common.js";

  const ICONS = {
    up: '<path d="M3 8l3-3 3 3" />',
    down: '<path d="M3 4l3 3 3-3" />',
    remove: '<path d="M3 3l6 6M9 3l-6 6" />',
  };
  const svg = (name) =>
    `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;

  let items = [];
  const list = document.getElementById("list");

  async function commit(next) {
    items = next;
    render();
    await save(items);
  }

  function tool(name, label, onClick, disabled = false) {
    const b = document.createElement("button");
    b.className = "sd-btn ghost icon";
    b.innerHTML = svg(name);
    b.title = label;
    b.setAttribute("aria-label", label);
    b.disabled = disabled;
    b.addEventListener("click", onClick);
    return b;
  }

  function render() {
    if (!items.length) {
      const empty = document.createElement("div");
      empty.className = "sd-empty";
      empty.textContent = "まだショートカットがありません。「アプリを追加」から選んでください。";
      list.replaceChildren(empty);
      return;
    }
    list.replaceChildren(...items.map((item, i) => {
      const row = document.createElement("div");
      row.className = "item";

      let icon;
      if (item.icon) {
        icon = document.createElement("img");
        icon.src = item.icon;
        icon.alt = "";
      } else {
        icon = document.createElement("span");
        icon.className = "fallback";
        icon.textContent = item.name.slice(0, 1);
      }

      const name = document.createElement("input");
      name.className = "name";
      name.value = item.name;
      name.setAttribute("aria-label", "表示名");
      name.addEventListener("change", () => {
        const v = name.value.trim();
        if (v && v !== item.name) commit(items.map((x) => (x.id === item.id ? { ...x, name: v } : x)));
      });
      name.addEventListener("keydown", (e) => { if (e.key === "Enter") name.blur(); });

      const path = document.createElement("div");
      path.className = "path";
      path.textContent = item.path;
      path.title = item.path;

      const text = document.createElement("div");
      text.className = "text";
      text.append(name, path);

      const move = (d) => {
        const next = [...items];
        [next[i], next[i + d]] = [next[i + d], next[i]];
        commit(next);
      };
      const tools = document.createElement("div");
      tools.className = "tools";
      tools.append(
        tool("up", "上へ移動", () => move(-1), i === 0),
        tool("down", "下へ移動", () => move(1), i === items.length - 1),
        tool("remove", "バーから外す", () => commit(items.filter((x) => x.id !== item.id))),
      );

      row.append(icon, text, tools);
      return row;
    }));
  }

  document.getElementById("add-app").addEventListener("click", async () => {
    const paths = await SideDock.dialog.pickFiles([
      { name: "アプリとショートカット", extensions: ["exe", "lnk", "url", "bat", "cmd", "appref-ms"] },
      { name: "すべてのファイル", extensions: ["*"] },
    ]);
    if (paths.length) commit(await addPaths(items, paths));
  });

  document.getElementById("add-folder").addEventListener("click", async () => {
    const path = await SideDock.dialog.pickFolder();
    if (path) commit(await addPaths(items, [path]));
  });

  // バーの側で追加・変更されたら反映（ドロップはバーの側で受け取る）
  SideDock.on("storageChanged", (data) => { items = data?.items ?? []; render(); });
  SideDock.on("panelShown", async () => { items = await load(); render(); });

  await SideDock.ready;
  items = await load();
  render();
</script>
</body>
</html>
