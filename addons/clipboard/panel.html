<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="http://addon.localhost/_sdk/sidedock.css">
<script src="http://addon.localhost/_sdk/sidedock.js"></script>
<style>
  body { padding: 10px; }
  .head { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  #q { min-height: 30px; font-size: 12px; border-radius: 9px; }
  #clear { flex: none; min-height: 30px; font-size: 11px; color: var(--sd-ink-2); }
  #list { display: flex; flex-direction: column; gap: 2px; }
  .clip {
    position: relative; display: flex; gap: 8px; align-items: flex-start;
    padding: 7px 8px 7px 10px; border-radius: 9px; cursor: default;
    transition: background 0.18s, transform 0.25s var(--sd-ease);
  }
  .clip:hover { background: var(--sd-hover); }
  .clip:active { transform: scale(0.985); }
  .clip.copied { background: color-mix(in srgb, var(--sd-accent) 16%, transparent); }
  .text {
    flex: 1; min-width: 0; font-size: 12px; line-height: 1.45;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    word-break: break-all; white-space: pre-wrap;
  }
  .meta { font-size: 10px; color: var(--sd-ink-3); margin-top: 2px; }
  .tools { display: flex; gap: 2px; opacity: 0; transition: opacity 0.18s; }
  .clip:hover .tools, .clip.pinned .tools { opacity: 1; }
  .tools button {
    appearance: none; border: 0; background: transparent; color: var(--sd-ink-3);
    width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; cursor: default;
  }
  .tools button:hover { background: var(--sd-hover); color: var(--sd-ink); }
  .tools svg { width: 12px; height: 12px; }
  .clip.pinned .pin { color: var(--sd-accent); }
  .clip:not(:hover).pinned .del { visibility: hidden; }
  .note { margin: 8px 2px 0; font-size: 10.5px; color: var(--sd-ink-3); }
</style>
</head>
<body>
  <div class="head">
    <input id="q" class="sd-input" type="search" placeholder="履歴を絞り込む" aria-label="履歴を絞り込む" spellcheck="false">
    <button id="clear" class="sd-btn ghost">すべて消す</button>
  </div>
  <div id="list"></div>
  <p class="note">パスワード管理アプリからコピーしたものは記録しません。ピン留めした項目は消えません。</p>
<script type="module">
  const $ = (id) => document.getElementById(id);
  const PIN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M9.5 2.5l4 4-2 1-2.5 2.5.5 3-1 1-3-3-3.5 3.5M4.5 7.5l4 4M6 6l2.5-2.5 1-2"/></svg>';
  const DEL = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
  let items = [];
  let armClear = 0;

  function ago(ms) {
    const s = Math.round((Date.now() - ms) / 1000);
    if (s < 60) return "たった今";
    if (s < 3600) return `${Math.floor(s / 60)} 分前`;
    if (s < 86400) return `${Math.floor(s / 3600)} 時間前`;
    return `${Math.floor(s / 86400)} 日前`;
  }

  function render() {
    const q = $("q").value.trim().toLowerCase();
    const shown = items.filter((c) => !q || c.text.toLowerCase().includes(q));
    if (!shown.length) {
      const e = document.createElement("div");
      e.className = "sd-empty";
      e.textContent = q ? "見つかりません" : "まだ何もコピーしていません。Ctrl+C でコピーすると、ここに残ります。";
      return $("list").replaceChildren(e);
    }
    $("list").replaceChildren(...shown.slice(0, 40).map((c) => {
      const row = document.createElement("div");
      row.className = `clip${c.pinned ? " pinned" : ""}`;
      row.title = "クリックでコピー";
      const body = document.createElement("div");
      body.style.flex = "1"; body.style.minWidth = "0";
      const t = document.createElement("div");
      t.className = "text";
      t.textContent = c.text;
      const m = document.createElement("div");
      m.className = "meta";
      m.textContent = `${ago(c.at)}・${c.text.length} 文字`;
      body.append(t, m);
      const tools = document.createElement("div");
      tools.className = "tools";
      const pin = document.createElement("button");
      pin.className = "pin"; pin.innerHTML = PIN; pin.setAttribute("aria-label", c.pinned ? "ピン留めを外す" : "ピン留め");
      pin.addEventListener("click", async (e) => { e.stopPropagation(); await SideDock.clipboard.pin(c.id, !c.pinned); load(); });
      const del = document.createElement("button");
      del.className = "del"; del.innerHTML = DEL; del.setAttribute("aria-label", "履歴から消す");
      del.addEventListener("click", async (e) => { e.stopPropagation(); await SideDock.clipboard.remove(c.id); load(); });
      tools.append(pin, del);
      row.append(body, tools);
      row.addEventListener("click", async () => {
        await SideDock.clipboard.copy(c.id).catch(() => {});
        row.classList.add("copied");
        m.textContent = "コピーしました";
        setTimeout(() => SideDock.ui.dismiss(), 380);
      });
      return row;
    }));
  }

  async function load() {
    items = await SideDock.clipboard.list().catch(() => []);
    render();
  }

  $("q").addEventListener("input", render);
  // 誤操作しないよう、2 回押したときだけ消す
  $("clear").addEventListener("click", async () => {
    if (Date.now() > armClear) {
      armClear = Date.now() + 2500;
      $("clear").textContent = "もう一度押すと消去";
      setTimeout(() => ($("clear").textContent = "すべて消す"), 2500);
      return;
    }
    armClear = 0;
    $("clear").textContent = "すべて消す";
    await SideDock.clipboard.clear();
    load();
  });
  SideDock.on("clipboardChanged", load);
  SideDock.on("panelShown", () => { $("q").value = ""; load(); });

  await SideDock.ready;
  load();
</script>
</body>
</html>
