<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="http://addon.localhost/_sdk/sidedock.css">
<script src="http://addon.localhost/_sdk/sidedock.js"></script>
<style>
  body { padding: 10px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .t {
    appearance: none; border: 0; background: transparent; color: var(--sd-ink); cursor: default;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 2px 8px; border-radius: 12px; font: inherit; font-size: 10.5px; line-height: 1.25; white-space: nowrap;
    transition: background 0.18s, transform 0.25s var(--sd-ease);
  }
  .t:hover { background: var(--sd-hover); }
  .t:active { transform: scale(0.93); }
  .t i {
    width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
    background: var(--sd-surface); box-shadow: inset 0 0 0 1px var(--sd-line);
    color: var(--sd-ink-2); transition: color 0.2s, box-shadow 0.2s;
  }
  .t:hover i { color: var(--sd-accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--sd-accent) 40%, transparent); }
  .t svg { width: 17px; height: 17px; }
  #err { margin: 6px 2px 0; font-size: 10.5px; color: var(--sd-danger); }
</style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <p id="err"></p>
<script type="module">
  const P = {
    shot: '<path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
    task: '<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M7 15l3-4 3 2.5 4-5"/>',
    folder: '<path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>',
    downloads: '<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/>',
    trash: '<path d="M5 7h14M9.5 7V5h5v2M6.5 7l1 12.5h9L17.5 7"/>',
    terminal: '<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M7.5 10l2.5 2.5L7.5 15M12.5 15.5h4"/>',
    note: '<path d="M14 4H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9z"/><path d="M14 4v5h5"/>',
    wifi: '<path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r=".8" fill="currentColor"/>',
    bt: '<path d="M7 7.5l10 9-5 4v-17l5 4-10 9"/>',
    sound: '<path d="M4 9.5h3l4.5-4v13L7 14.5H4z"/><path d="M15 9a4 4 0 0 1 0 6M17.5 6.5a7.5 7.5 0 0 1 0 11"/>',
    display: '<rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M9 20h6M12 16.5V20"/>',
  };
  const TOOLS = [
    ["shot", "スクショ", "ms-screenclip:"],
    ["settings", "設定", "ms-settings:"],
    ["task", "タスク管理", "taskmgr.exe"],
    ["folder", "ファイル", "explorer.exe"],
    ["downloads", "ダウンロード", "shell:Downloads"],
    ["trash", "ごみ箱", "shell:RecycleBinFolder"],
    ["terminal", "ターミナル", "wt.exe", "cmd.exe"],
    ["note", "メモ帳", "notepad.exe"],
    ["wifi", "Wi-Fi", "ms-settings:network-wifi"],
    ["bt", "Bluetooth", "ms-settings:bluetooth"],
    ["sound", "サウンド", "ms-settings:sound"],
    ["display", "ディスプレイ", "ms-settings:display"],
  ];
  document.getElementById("grid").replaceChildren(...TOOLS.map(([icon, label, target, fallback]) => {
    const b = document.createElement("button");
    b.className = "t";
    b.innerHTML = `<i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${P[icon]}</svg></i><span></span>`;
    b.lastChild.innerText = label;
    b.addEventListener("click", async () => {
      // スクリーンショットは、カプセルが写り込まないよう先に引っ込める
      SideDock.ui.dismiss();
      if (icon === "shot") await new Promise((r) => setTimeout(r, 380));
      try { await SideDock.app.launch(target); }
      catch (e) {
        if (fallback) await SideDock.app.launch(fallback).catch(() => {});
        else document.getElementById("err").textContent = e.message;
      }
    });
    return b;
  }));
  await SideDock.ready;
</script>
</body>
</html>
